<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Annuaire de Contacts - Peugeot Strasbourg</title>

<style>
*{
    box-sizing:border-box
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    padding:30px 30px 100px;
    background:#0a0a0a;
    margin:0;
    min-height:100vh;
    position:relative;
    justify-content:center;
    align-content:flex-start
}

.header-band{
    width:100%;
    text-align:center;
    margin-bottom:20px
}

.brand-title{
    color:#fff;
    font-size:22px;
    letter-spacing:2px;
    margin:0 0 8px;
    text-transform:uppercase;
    font-weight:700
}

.header-band h1{
    color:#4a9eff;
    font-size:17px;
    letter-spacing:1px;
    margin:0 0 4px;
    text-transform:uppercase;
    font-weight:600
}

.header-band p{
    color:#999;
    font-size:13px;
    margin:0
}

.section-title{
    width:100%;
    max-width:980px;
    color:#fff;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    border-bottom:1px solid #2a2a2a;
    padding:10px 4px 8px;
    margin-top:8px
}

.card{
    background:#151515;
    border:1px solid #2a2a2a;
    border-radius:10px;
    padding:24px 20px;
    width:220px;
    text-align:center;
    cursor:pointer;
    box-shadow:0 4px 10px rgba(0,0,0,.4);
    transition:.2s
}

.card:hover{
    border-color:#4a9eff;
    box-shadow:0 8px 20px rgba(74,158,255,.25);
    transform:translateY(-3px)
}

.avatar,.avatar-lg{
    border-radius:50%;
    background:linear-gradient(135deg,#4a9eff,#1a5fb4);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-weight:bold
}

.avatar{
    width:64px;
    height:64px;
    margin:0 auto 14px;
    font-size:20px
}

.card h3{
    margin:0 0 6px;
    color:#f2f2f2;
    font-size:15px
}

.card p{
    margin:4px 0;
    color:#a8a8a8;
    font-size:12px
}

.hint{
    display:inline-block;
    margin-top:14px;
    font-size:11px;
    color:#4a9eff;
    font-weight:bold;
    letter-spacing:.5px;
    text-transform:uppercase
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:15px
}

.overlay.active{
    display:flex
}

.modal{
    background:#151515;
    border:1px solid #2a2a2a;
    border-radius:14px;
    padding:32px 28px;
    width:320px;
    max-width:100%;
    text-align:center;
    position:relative;
    box-shadow:0 15px 40px rgba(0,0,0,.6);
    max-height:90vh;
    overflow-y:auto
}

.avatar-lg{
    width:80px;
    height:80px;
    margin:0 auto 14px;
    font-size:26px
}

.modal h2{
    margin:0 0 4px;
    color:#f7f7f7;
    font-size:19px
}

.modal .poste{
    color:#4a9eff;
    font-weight:bold;
    margin-bottom:22px;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.5px
}

.info-line{
    text-align:left;
    margin:12px 0;
    font-size:14px;
    color:#ddd;
    border-bottom:1px solid #262626;
    padding-bottom:8px
}

.info-line strong{
    display:block;
    color:#777;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.5px;
    margin-bottom:2px
}

.download-btn{
    margin-top:22px;
    padding:12px 16px;
    background:#fff;
    color:#0a0a0a;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    width:100%
}

.download-btn:hover{
    background:#4a9eff;
    color:#fff
}

.close-btn{
    position:absolute;
    top:12px;
    right:12px;
    cursor:pointer;
    font-size:15px;
    line-height:1;
    color:#999;
    background:#262626;
    border:none;
    border-radius:50%;
    width:28px;
    height:28px
}

.close-btn:hover{
    background:#333;
    color:#fff
}

.footer-brand{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#000;
    border-top:1px solid #222;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50
}

.footer-brand span{
    color:#ccc;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    font-weight:600
}


/* TABLETTE */

@media(max-width:900px){

    body{
        padding:25px 20px 100px;
        gap:18px
    }

    .card{
        width:200px;
    }

}


/* TELEPHONE */

@media(max-width:600px){

        line-height:1.5;

    }

    .section-title{
        max-width:100%;
        font-size:14px;
        padding:12px 4px 10px;
        margin-top:14px;
    }

    .card{
        width:100%;
        max-width:500px;
        padding:22px 15px;
        min-height:170px;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
    }

    .avatar{
        width:72px;
        height:72px;
        margin-bottom:14px;
        font-size:23px;
    }

    .card h3{
        font-size:18px;
        margin-bottom:8px;
    }

    .card p{
        font-size:14px;
    }

    .hint{
        margin-top:15px;
        font-size:11px;
    }

    .overlay{
        padding:10px;
        align-items:center;
    }

    .modal{
        width:100%;
        max-width:500px;
        padding:35px 22px 25px;
        border-radius:16px;
        max-height:92vh;
    }

    .avatar-lg{
        width:90px;
        height:90px;
        font-size:29px;
        margin-bottom:16px;
    }

    .modal h2{
        font-size:23px;
        margin-bottom:7px;
    }

    .modal .poste{
        font-size:14px;
        margin-bottom:24px;
    }

    .info-line{
        font-size:16px;
        margin:14px 0;
        padding-bottom:10px;
        line-height:1.4;
    }

    .info-line strong{
        font-size:11px;
        margin-bottom:4px;
    }

    .download-btn{
        padding:16px;
        font-size:16px;
        margin-top:24px;
        min-height:52px;
    }

    .close-btn{
        width:36px;
        height:36px;
        top:10px;
        right:10px;
        font-size:18px;
    }

    .footer-brand{
        height:65px;
        padding:12px;
    }

    .footer-brand span{
        font-size:12px;
    }

}


/* PETITS TELEPHONES */

@media(max-width:380px){

    body{
        padding-left:10px;
        padding-right:10px;
    }

    .brand-title{
        font-size:19px;
    }

    .header-band h1{
        font-size:14px;
    }

    .header-band p{
        font-size:12px;
    }

    .card{
        min-height:155px;
        padding:18px 12px;
    }

    .avatar{
        width:64px;
        height:64px;
        font-size:20px;
    }

    .card h3{
        font-size:16px;
    }

    .card p{
        font-size:13px;
    }

    .modal h2{
        font-size:21px;
    }

}

</style>
</head>

function getNomComplet(profil){

    return `${profil.prenom} ${profil.nomFamille}`;

}


function getInitiales(profil){

    return (
        profil.prenom.charAt(0) +
        profil.nomFamille.charAt(0)
    ).toUpperCase();

}


function ouvrirFiche(profil){

    const modal =
        document.getElementById('modalContent');

    modal.innerHTML = `

        <button
            class="close-btn"
            onclick="fermerFiche()"
        >
            &#10005;
        </button>


        <div class="avatar-lg">
            ${getInitiales(profil)}
        </div>


        <h2>
            ${getNomComplet(profil)}
        </h2>


        <div class="poste">
            ${profil.poste}
        </div>


        ${
            profil.tel
            ?
            `<div class="info-line">

                <strong>Téléphone</strong>

                <a
                    href="tel:${profil.tel.replace(/\s/g,'')}"
                    style="color:#ddd;text-decoration:none"
                >
                    ${profil.tel}
                </a>

            </div>`
            :
            ''
        }


        ${
            profil.email
            ?
            `<div class="info-line">

                <strong>Email</strong>

                <a
                    href="mailto:${profil.email}"
                    style="color:#ddd;text-decoration:none"
                >
                    ${profil.email}
                </a>

            </div>`
            :
            ''
        }


        <div class="info-line">

            <strong>Concession</strong>

            ${profil.site}

        </div>


        <div class="info-line">

            <strong>Adresse</strong>

            ${profil.adresse}

        </div>


        <button
            class="download-btn"
            onclick='telechargerVCard(${JSON.stringify(profil)})'
        >
            Télécharger le contact (.vcf)
        </button>

    `;


    document
        .getElementById('overlay')
        .classList
        .add('active');

}


function fermerFiche(){

    document
        .getElementById('overlay')
        .classList
        .remove('active');

}


document
    .getElementById('overlay')
    .addEventListener('click', e => {

        if(e.target.id === 'overlay'){

            fermerFiche();

        }

    });


function telechargerVCard(profil){

    const emailLine =
        profil.email
        ? `EMAIL;TYPE=WORK:${profil.email}`
        : "";


    const telLine =
        profil.tel
        ? `TEL;TYPE=CELL:${profil.tel}`
        : "";


    const vcard = `BEGIN:VCARD
VERSION:3.0
N:${profil.nomFamille};${profil.prenom};;;
FN:${getNomComplet(profil)}
TITLE:${profil.poste}
ORG:Grand Est Automobiles;${profil.site}
${telLine}
${emailLine}
ADR;TYPE=WORK:;;${profil.adresse};;;
END:VCARD`;


    const blob = new Blob(
        [vcard],
        {
            type:'text/vcard;charset=utf-8'
        }
    );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement('a');


    a.href = url;


    a.download =
        `${profil.prenom}_${profil.nomFamille}.vcf`;


    document.body.appendChild(a);


    a.click();


    document.body.removeChild(a);


    URL.revokeObjectURL(url);

}


profils.forEach(profil => {

    const carte =
        document.createElement('div');


    carte.className =
        'card';


    carte.innerHTML = `

        </p>

        </span>

    `;


    carte.onclick = () =>
        ouvrirFiche(profil);


    document
        .getElementById(profil.groupe)
        .appendChild(carte);

});
