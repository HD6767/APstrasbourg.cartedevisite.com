<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Annuaire de Contacts - Peugeot Strasbourg</title>

<style>
/* =========================================================
   RESET
   ========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    margin:0;
    padding:0;
    background:#0a0a0a;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    margin:0;
    min-height:100vh;
    padding:25px 20px 100px;
    background:#0a0a0a;
    color:#fff;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-content:flex-start;
    gap:20px;

    overflow-x:hidden;
}


/* =========================================================
   HEADER
   ========================================================= */

.header-band{
    width:100%;
    max-width:980px;
    text-align:center;
    margin-bottom:8px;
}

.brand-title{
    color:#fff;
    font-size:23px;
    letter-spacing:2px;
    margin:0 0 8px;
    text-transform:uppercase;
    font-weight:700;
}

.header-band h1{
    color:#4a9eff;
    font-size:17px;
    letter-spacing:1px;
    margin:0 0 5px;
    text-transform:uppercase;
    font-weight:600;
}

.header-band p{
    color:#999;
    font-size:13px;
    margin:0;
}


/* =========================================================
   SECTIONS
   ========================================================= */

.section-title{
    width:100%;
    max-width:980px;

    color:#fff;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;

    border-bottom:1px solid #2a2a2a;

    padding:12px 4px 9px;
    margin-top:8px;
}


/*
   Chaque groupe devient une vraie grille responsive.
*/
.profiles-grid{
    width:100%;
    max-width:980px;

    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));

    gap:16px;

    margin-bottom:8px;
}


/* =========================================================
   CARDS
   ========================================================= */

.card{
    background:#151515;
    border:1px solid #2a2a2a;
    border-radius:12px;

    padding:22px 15px;

    width:100%;
    min-width:0;

    text-align:center;
    cursor:pointer;

    box-shadow:0 4px 10px rgba(0,0,0,.4);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

    user-select:none;
    -webkit-user-select:none;
}

.card:hover{
    border-color:#4a9eff;
    box-shadow:0 8px 20px rgba(74,158,255,.25);
    transform:translateY(-3px);
}

.card:active{
    transform:scale(.98);
    border-color:#4a9eff;
}


/* =========================================================
   AVATARS
   ========================================================= */

.avatar,
.avatar-lg{
    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #4a9eff,
            #1a5fb4
        );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-weight:bold;

    flex-shrink:0;
}

.avatar{
    width:64px;
    height:64px;

    margin:0 auto 14px;

    font-size:20px;
}

.card h3{
    margin:0 0 6px;

    color:#f2f2f2;

    font-size:15px;
    line-height:1.3;
}

.card p{
    margin:4px 0;

    color:#a8a8a8;

    font-size:12px;
    line-height:1.4;
}

.hint{
    display:inline-block;

    margin-top:14px;

    font-size:11px;
    color:#4a9eff;

    font-weight:bold;
    letter-spacing:.5px;

    text-transform:uppercase;
}


/* =========================================================
   OVERLAY
   ========================================================= */

.overlay{
    display:none;

    position:fixed;
    inset:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,.78);

    align-items:center;
    justify-content:center;

    z-index:100;

    padding:15px;

    overflow-y:auto;

    -webkit-backdrop-filter:blur(4px);
    backdrop-filter:blur(4px);
}

.overlay.active{
    display:flex;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal{
    background:#151515;

    border:1px solid #2a2a2a;
    border-radius:14px;

    padding:30px 25px;

    width:100%;
    max-width:380px;

    max-height:calc(100vh - 30px);

    overflow-y:auto;

    text-align:center;

    position:relative;

    box-shadow:0 15px 40px rgba(0,0,0,.6);

    animation:modal
