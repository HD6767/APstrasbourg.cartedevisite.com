<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Annuaire de Contacts - Peugeot Strasbourg</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    background:#0a0a0a;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    min-height:100vh;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-content:flex-start;

    gap:18px;

    padding:
        25px 20px
        100px;

    color:#fff;

    overflow-x:hidden;
}


/* =========================================================
   HEADER
   ========================================================= */

.header-band{
    width:100%;
    max-width:1000px;

    text-align:center;

    margin-bottom:5px;
}

.brand-title{
    color:#fff;

    font-size:23px;
    font-weight:700;

    letter-spacing:2px;

    margin:0 0 8px;

    text-transform:uppercase;
}

.header-band h1{
    color:#4a9eff;

    font-size:17px;
    font-weight:600;

    letter-spacing:1px;

    margin:0 0 5px;

    text-transform:uppercase;
}

.header-band p{
    color:#999;

    font-size:13px;

    margin:0;
}


/* =========================================================
   TITRES DES SECTIONS
   ========================================================= */

.section-title{
    width:100%;
    max-width:1000px;

    color:#fff;

    font-size:14px;
    font-weight:600;

    letter-spacing:1px;

    text-transform:uppercase;

    border-bottom:1px solid #2a2a2a;

    padding:10px 4px 8px;

    margin-top:7px;
}


/* =========================================================
   CONTENEURS DES VENDEURS
   ========================================================= */

.profiles-grid{

    width:100%;
    max-width:1000px;

    display:grid;

    grid-template-columns:
        repeat(4,minmax(0,1fr));

    gap:16px;

}


/* =========================================================
   CARTE VENDEUR
   ========================================================= */

.card{

    width:100%;
    min-width:0;

    background:#151515;

    border:1px solid #2a2a2a;

    border-radius:12px;

    padding:22px 12px;

    text-align:center;

    cursor:pointer;

    box-shadow:
        0 4px 10px rgba(0,0,0,.4);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

    user-select:none;
}

.card:hover{

    border-color:#4a9eff;

    box-shadow:
        0 8px 20px
        rgba(74,158,255,.25);

    transform:translateY(-3px);
}

.card:active{

    transform:scale(.98);

    border-color:#4a9eff;
}


/* =========================================================
   AVATAR
   ========================================================= */

.avatar,
.avatar-lg{

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #4a9eff,
            #1a5fb4
        );

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    font-weight:bold;

    flex-shrink:0;
}

.avatar{

    width:64px;
    height:64px;

    margin:0 auto 14px;

    font-size:20px;
}

.card h3{

    margin:0 0 6px;

    color:#f2f2f2;

    font-size:15px;

    line-height:1.3;

    word-break:break-word;
}

.card p{

    margin:4px 0;

    color:#a8a8a8;

    font-size:12px;

    line-height:1.4;
}

.hint{

    display:inline-block;

    margin-top:14px;

    color:#4a9eff;

    font-size:10px;

    font-weight:bold;

    letter-spacing:.5px;

    text-transform:uppercase;
}


/* =========================================================
   FENÊTRE FICHE CONTACT
   ========================================================= */

.overlay{

    display:none;

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:
        rgba(0,0,0,.80);

    align-items:center;
    justify-content:center;

    z-index:100;

    padding:15px;

    overflow-y:auto;

    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
}

.overlay.active{

    display:flex;
}

    position
